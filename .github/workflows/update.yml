name: Auto Build Steam Game Deals Site

on:
  schedule:
    - cron: '0 13 * * *' # 日本時間 毎日22:00 (UTC 13:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 過去の履歴を全て取得して競合を防止

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwrightは不要のため削除（動作高速化）

      - name: Run Build Script (Generate Steam Game Deals Pages)
        run: node scripts/fetch-deals.js # ※ご自身が保存したスクリプトファイル名に合わせて変更してください

      - name: Post to Bluesky (Global Auto-Post)
        if: env.BLUESKY_HANDLE != '' && env.BLUESKY_PASSWORD != ''
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node scripts/post-bluesky.js

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Steam Game Deals content [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Notify Discord for X Post Stock Global (with Image)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord.js